syntax = "proto3";

option go_package = "github.com/ccrabbai/logos/logsv1";
package logsv1;

message Record {
    bytes value = 1;
    uint64 offset = 2;
    uint32 checksum = 3;
    string producer_id = 4;
    int64 created_at = 5;
}

message ProduceRequest {
    Record record = 1;
}

message ProduceResponse {
    uint64 offset = 1;
}

message ConsumeRequest {
    uint64 offset = 1;
}

message ConsumeResponse {
    Record record = 1;
}